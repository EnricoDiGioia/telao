# Temporário: inspeciona a captura de tela da biblioteca WebRTC usada pelo app
name: Inspecao lib
on:
  push:
    branches: [inspecao-lib]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Baixar e inspecionar
        run: |
          mkdir -p lib out && cd lib
          curl -sSL -o lib.aar https://repo1.maven.org/maven2/io/getstream/stream-webrtc-android/1.3.9/stream-webrtc-android-1.3.9.aar
          unzip -q -o lib.aar classes.jar && unzip -q -o classes.jar 'org/webrtc/ScreenCapturerAndroid*'
          javap -c -p -classpath . org.webrtc.ScreenCapturerAndroid > ../out/ScreenCapturerAndroid.txt
          javap -c -p -classpath . 'org.webrtc.ScreenCapturerAndroid$2' > ../out/ScreenCapturerAndroid2.txt
          ls org/webrtc/ScreenCapturerAndroid* >> ../out/ScreenCapturerAndroid.txt
      - name: Guardar resultado no ramo
        run: |
          git config user.name "telao-bot"; git config user.email "telao-bot@users.noreply.github.com"
          git add out && git commit -m "resultado da inspeção" && git push
