# Configuração da publicação na Cloudflare (npx wrangler deploy)
name = "telao"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
MAX_PER_ROOM = "8"
# Servidor TURN opcional (veja o README). A senha vai como segredo:
#   npx wrangler secret put TURN_PASS
# TURN_URL = "turn:endereco:3478,turns:endereco:443"
# TURN_USER = "usuario"
